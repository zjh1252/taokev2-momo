
services:

  nacos:
    image: 10.0.16.26:5000/taokev2/nacos:3.1.2
    container_name: taokev2-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8180:8080"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "dGFva2V2Mi1uYWNvcy1hdXRoLXRva2VuLW11c3QtYmUtYXQtbGVhc3QtMzItY2hhcnM="
      NACOS_AUTH_IDENTITY_KEY: taokev2
      NACOS_AUTH_IDENTITY_VALUE: taokev2-nacos
      TZ: Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/ns/operator/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: 10.0.16.26:5000/taokev2/nginx:1.27-alpine
    container_name: taokev2-nginx
    ports:
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./web/nginx-logs:/var/log/nginx
      - ./web/storage:/data/storage:ro
    depends_on:
      - frontend
      - admin
    restart: unless-stopped

  backend:
    image: 10.0.16.26:5000/taokev2/backend:${VERSION:-latest}
    container_name: taokev2-backend
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./web/storage:/app/storage
    environment:
      SPRING_PROFILES_ACTIVE: test
      TZ: Asia/Shanghai
    command: ["--spring.config.additional-location=file:/app/config/"]
    depends_on:
      nacos:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    image: 10.0.16.26:5000/taokev2/frontend:${VERSION:-latest}
    container_name: taokev2-frontend
    expose:
      - "3000"
    environment:
      HOSTNAME: 0.0.0.0
      TZ: Asia/Shanghai
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    image: 10.0.16.26:5000/taokev2/admin:${VERSION:-latest}
    container_name: taokev2-admin
    expose:
      - "3000"
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:8080
      TZ: Asia/Shanghai
    depends_on:
      - backend
    restart: unless-stopped

  elasticsearch:
    image: 10.0.16.26:5000/taokev2/elasticsearch-with-ik-m:8.19.13
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    container_name: taokev2-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=taokev2es
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
      - xpack.monitoring.collection.enabled=false
      - xpack.watcher.enabled=false
      - bootstrap.system_call_filter=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - TZ=Asia/Shanghai
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:taokev2es http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  es-setup:
    image: 10.0.16.26:5000/taokev2/elasticsearch:8.19.13
    container_name: taokev2-es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    command: >
      bash -c '
        ES="http://elasticsearch:9200";
        AUTH="elastic:taokev2es";
        H="Content-Type: application/json";

        echo "=== Elasticsearch 账号初始化 ===";

        echo "[1/4] 设置 kibana_system 密码...";
        curl -sf -u $$AUTH -X POST "$$ES/_security/user/kibana_system/_password" \
          -H "$$H" -d "{\"password\":\"taokev2es\"}" && echo " OK" || echo " FAIL";

        echo "[2/4] 创建 logstash_writer 角色...";
        curl -sf -u $$AUTH -X PUT "$$ES/_security/role/logstash_writer_role" \
          -H "$$H" -d "{
            \"cluster\":[\"manage_index_templates\",\"monitor\"],
            \"indices\":[{\"names\":[\"*\",\"-.*\"],\"privileges\":[\"create_index\",\"write\",\"manage\"]}]
          }" && echo " OK" || echo " FAIL";

        echo "[3/4] 创建 logstash_writer 用户...";
        curl -sf -u $$AUTH -X POST "$$ES/_security/user/logstash_writer" \
          -H "$$H" -d "{
            \"password\":\"taokev2logstash\",
            \"roles\":[\"logstash_writer_role\"],
            \"full_name\":\"Logstash Writer\"
          }" && echo " OK" || echo " FAIL";

        echo "[4/4] 创建 app_search 角色和用户...";
        curl -sf -u $$AUTH -X PUT "$$ES/_security/role/app_search_role" \
          -H "$$H" -d "{
            \"cluster\":[\"monitor\"],
            \"indices\":[{\"names\":[\"taokev2*\"],\"privileges\":[\"all\"]}]
          }" && echo " OK" || echo " FAIL";
        curl -sf -u $$AUTH -X POST "$$ES/_security/user/app_search" \
          -H "$$H" -d "{
            \"password\":\"taokev2search\",
            \"roles\":[\"app_search_role\"],
            \"full_name\":\"App Search Client\"
          }" && echo " OK" || echo " FAIL";

        echo "=== 初始化完成 ===";
      '

  kibana:
    image: 10.0.16.26:5000/taokev2/kibana:8.19.13
    container_name: taokev2-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=taokev2es
      - TZ=Asia/Shanghai
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  es-data:
