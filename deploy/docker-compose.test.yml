# ============================================================
# 淘课网 v2 — Test 环境 Docker Compose
#
# 用法：
#   VERSION=1.0.1 docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down
#
# 前置条件：
#   1. 镜像已通过 ./build.sh <version> test 构建并推送
#   2. application-test.yaml 已放到 ./config/ 目录下
#   3. 域名 v2.taoke.com / adminv2.taoke.com 已解析到本机
#   4. 已按 deploy/nginx/ssl/README.md 生成自签证书（仅映射宿主机 443，不占用 80）
# ============================================================

services:

  nginx:
    image: 10.0.16.26:5000/taokev2/nginx:1.27-alpine
    container_name: taokev2-nginx
    ports:
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./web/nginx-logs:/var/log/nginx
      - ./web/storage:/data/storage:ro
    depends_on:
      - frontend
      - admin
    restart: unless-stopped

  backend:
    image: 10.0.16.26:5000/taokev2/backend:${VERSION:-latest}
    container_name: taokev2-backend
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./web/storage:/app/storage
    environment:
      SPRING_PROFILES_ACTIVE: test
      TZ: Asia/Shanghai
    command: ["--spring.config.additional-location=file:/app/config/"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: 10.0.16.26:5000/taokev2/frontend:${VERSION:-latest}
    container_name: taokev2-frontend
    expose:
      - "3000"
    environment:
      HOSTNAME: 0.0.0.0
      TZ: Asia/Shanghai
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    image: 10.0.16.26:5000/taokev2/admin:${VERSION:-latest}
    container_name: taokev2-admin
    expose:
      - "3000"
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:8080
      TZ: Asia/Shanghai
    depends_on:
      - backend
    restart: unless-stopped
