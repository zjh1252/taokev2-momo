# ============================================================
# 淘课网 v2 — Test 环境 Docker Compose
#
# 用法：
#   VERSION=1.0.1 docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down
#
# 前置条件：
#   1. 镜像已通过 ./build.sh <version> test 构建并推送
#   2. application-test.yaml 已放到 ./config/ 目录下
#   3. 域名 v2.taoke.com / adminv2.taoke.com 已解析到本机
#   4. 已按 deploy/nginx/ssl/README.md 生成自签证书（仅映射宿主机 443，不占用 80）
#   5. MySQL 中已创建 nacos_config 库并导入 Nacos 建表脚本
#      （首次部署：docker exec taokev2-nacos cat /home/nacos/conf/mysql-schema.sql | mysql -h10.0.14.20 -uroot -proot nacos_config）
# ============================================================

services:

  nacos:
    image: 10.0.16.26:5000/taokev2/nacos:3.1.2
    container_name: taokev2-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8180:8080"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "dGFva2V2Mi1uYWNvcy1hdXRoLXRva2VuLW11c3QtYmUtYXQtbGVhc3QtMzItY2hhcnM="
      NACOS_AUTH_IDENTITY_KEY: taokev2
      NACOS_AUTH_IDENTITY_VALUE: taokev2-nacos
      TZ: Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: 10.0.16.26:5000/taokev2/nginx:1.27-alpine
    container_name: taokev2-nginx
    ports:
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./web/nginx-logs:/var/log/nginx
      - ./web/storage:/data/storage:ro
    depends_on:
      - frontend
      - admin
    restart: unless-stopped

  backend:
    image: 10.0.16.26:5000/taokev2/backend:${VERSION:-latest}
    container_name: taokev2-backend
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./web/storage:/app/storage
    environment:
      SPRING_PROFILES_ACTIVE: test
      TZ: Asia/Shanghai
    command: ["--spring.config.additional-location=file:/app/config/"]
    depends_on:
      nacos:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: 10.0.16.26:5000/taokev2/frontend:${VERSION:-latest}
    container_name: taokev2-frontend
    expose:
      - "3000"
    environment:
      HOSTNAME: 0.0.0.0
      TZ: Asia/Shanghai
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    image: 10.0.16.26:5000/taokev2/admin:${VERSION:-latest}
    container_name: taokev2-admin
    expose:
      - "3000"
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:8080
      TZ: Asia/Shanghai
    depends_on:
      - backend
    restart: unless-stopped
