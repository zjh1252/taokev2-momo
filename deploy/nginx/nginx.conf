worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500m;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # 测试环境自签证书（仅对外暴露 443，不监听 80）
    # 生成方式：deploy/nginx/ssl/README.md
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    

    # -------- C 端前端：v2.taoke.com --------
    server {
        listen 443 ssl;
        server_name v2.taoke.com;
        ssl_certificate     /etc/nginx/ssl/taoke-selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/taoke-selfsigned.key;

        location /uploads/ {
            alias /data/storage/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /backend-api/ {
            proxy_pass http://backend:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
        
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # -------- 管理后台：adminv2.taoke.com --------
    server {
        listen 443 ssl;
        server_name adminv2.taoke.com;
        ssl_certificate     /etc/nginx/ssl/taoke-selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/taoke-selfsigned.key;

        location /uploads/ {
            alias /data/storage/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://admin:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # -------- 默认：返回 444 拒绝未知域名（仅 443）--------
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/nginx/ssl/taoke-selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/taoke-selfsigned.key;
        return 444;
    }
}
