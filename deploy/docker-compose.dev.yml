
services:
  mysql:
    image: mysql:8.4
    container_name: taokev2-dev-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: v3test
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - taokev2-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot123456']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: taokev2-dev-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taokev2-dev-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./docker-dev/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker-dev/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    image: 10.0.16.26:5000/taokev2/elasticsearch-with-ik-m:8.19.13
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    container_name: taokev2-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=taokev2es
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
      - xpack.monitoring.collection.enabled=false
      - xpack.watcher.enabled=false
      - bootstrap.system_call_filter=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - TZ=Asia/Shanghai
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:taokev2es http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  es-setup:
    image: 10.0.16.26:5000/taokev2/elasticsearch:8.19.13
    container_name: taokev2-es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    command: >
      bash -c '
        ES="http://elasticsearch:9200";
        AUTH="elastic:taokev2es";
        H="Content-Type: application/json";

        echo "=== Elasticsearch 账号初始化 ===";

        echo "[1/4] 设置 kibana_system 密码...";
        curl -sf -u $$AUTH -X POST "$$ES/_security/user/kibana_system/_password" \
          -H "$$H" -d "{\"password\":\"taokev2es\"}" && echo " OK" || echo " FAIL";

        echo "[2/4] 创建 logstash_writer 角色...";
        curl -sf -u $$AUTH -X PUT "$$ES/_security/role/logstash_writer_role" \
          -H "$$H" -d "{
            \"cluster\":[\"manage_index_templates\",\"monitor\"],
            \"indices\":[{\"names\":[\"*\",\"-.*\"],\"privileges\":[\"create_index\",\"write\",\"manage\"]}]
          }" && echo " OK" || echo " FAIL";

        echo "[3/4] 创建 logstash_writer 用户...";
        curl -sf -u $$AUTH -X POST "$$ES/_security/user/logstash_writer" \
          -H "$$H" -d "{
            \"password\":\"taokev2logstash\",
            \"roles\":[\"logstash_writer_role\"],
            \"full_name\":\"Logstash Writer\"
          }" && echo " OK" || echo " FAIL";

        echo "[4/4] 创建 app_search 角色和用户...";
        curl -sf -u $$AUTH -X PUT "$$ES/_security/role/app_search_role" \
          -H "$$H" -d "{
            \"cluster\":[\"monitor\"],
            \"indices\":[{\"names\":[\"taokev2*\"],\"privileges\":[\"all\"]}]
          }" && echo " OK" || echo " FAIL";
        curl -sf -u $$AUTH -X POST "$$ES/_security/user/app_search" \
          -H "$$H" -d "{
            \"password\":\"taokev2search\",
            \"roles\":[\"app_search_role\"],
            \"full_name\":\"App Search Client\"
          }" && echo " OK" || echo " FAIL";

        echo "=== 初始化完成 ===";
      '

  kibana:
    image: 10.0.16.26:5000/taokev2/kibana:8.19.13
    container_name: taokev2-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=taokev2es
      - TZ=Asia/Shanghai
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  crawler-service:
    build:
      context: ../crawler-service
      args:
        PYTHON_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
    container_name: taokev2-dev-crawler-service
    ports:
      - '8100:8100'
    environment:
      SERVER_PORT: 8100
      CALLBACK_URL: http://host.docker.internal:18080/internal/crawl/callback
      CALLBACK_TOKEN: local-crawler-token
      TZ: Asia/Shanghai
    volumes:
      - ../crawler-service:/app
    command: ['uvicorn', 'main:app', '--host', '0.0.0.0', '--port', '8100', '--reload']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  taokev2-mysql-data:
  es-data:
