# ============================================================
# 开发环境配置 — 中间件连接、密钥、日志级别等
# ============================================================
server:
  port: 8080

# Nacos 配置中心
spring:
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
      - optional:file:backend/.env.local[.properties]

  datasource:
    url: jdbc:mysql://10.0.14.20:3306/v3test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 'root'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000

  data:
    redis:
      host: 10.0.14.20
      port: 6379
      database: 0
      timeout: 3000ms

  rabbitmq:
    host: 10.0.14.20
    port: 5672
    username: guest
    password: guest
    virtual-host: /taokev2-test

  jpa:
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

taoke:
  legacy-api:
    pxb-outbound:
      base-url: ${PXB_SITE_URL:http://dev.91pxb.com}
  # 本地开发：mock 短信 + 关闭滑块，与前端 NEXT_PUBLIC_MOCK_SMS=true 对齐
  sms:
    provider: mock
  captcha:
    enabled: false
  elasticsearch:
    uris: http://10.0.14.20:9200
    username: app_search
    password: taokev2search
    index-name: taokev2app
    sync-interval: 10000
  event:
    enabled: true
  jwt:
    secret: taoke-v2-jwt-secret-key-must-be-at-least-256-bits-long!!
  storage:
    # 开发环境与生产一致，上传走阿里云 OSS（peixunbao-videos）；仅本地磁盘调试时设 STORAGE_PROVIDER=local
    provider: ${STORAGE_PROVIDER:aliyun-oss}
    oss:
      # 凭据与老站 AliOssUploader / config.video.inc.php 一致，生产请改用环境变量注入
      access-key-id: ${OSS_ACCESS_KEY_ID:trnzwn5eNnrr4gVM}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:fR1lAIEH3kgoPmMlUeTAtVIEgO1r2b}
  ocr:
    aliyun:
      enabled: true
      endpoint: ${ALIYUN_OCR_ENDPOINT:ocr-api.cn-hangzhou.aliyuncs.com}
      # 开发环境默认复用老站 AccessKey；生产建议改成只授予 OCR 权限的 RAM 子账号
      access-key-id: ${ALIYUN_OCR_ACCESS_KEY_ID:${OSS_ACCESS_KEY_ID:trnzwn5eNnrr4gVM}}
      access-key-secret: ${ALIYUN_OCR_ACCESS_KEY_SECRET:${OSS_ACCESS_KEY_SECRET:fR1lAIEH3kgoPmMlUeTAtVIEgO1r2b}}
      timeout-ms: 60000
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:3001
      - http://127.0.0.1:3001
    allow-credentials: true
  # AI 能力（开发环境从本地环境变量 NEWAPI_API_KEY 读取）
  ai:
    enabled: true
    base-url: ${NEWAPI_BASE_URL:http://10.0.0.118:43000/v1}
    api-key: ${NEWAPI_API_KEY:}
    model: ${NEWAPI_MODEL:gpt-5.5}
    temperature: 0.2
    timeout-ms: 1200000
    max-input-chars: 50000

# 爬虫服务（开发环境）
# crawler-service 在 Docker 内运行时，回调须用 host.docker.internal 访问宿主机 Java（18080）
# 若改为本机直接 uvicorn 启动爬虫，可改回 http://localhost:18080/internal/crawl/callback
crawler:
  base-url: http://localhost:8100
  callback-url: ${CRAWLER_CALLBACK_URL:http://localhost:8080/internal/crawl/callback}
  callback-token: local-crawler-token

logging:
  level:
    com.taoke: info
    org.springframework.security: info
