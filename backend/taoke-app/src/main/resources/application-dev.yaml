# ============================================================
# 开发环境配置 — 中间件连接、密钥、日志级别等
# ============================================================
server:
  port: 8080

# Nacos 配置中心
spring:
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
      - optional:file:backend/.env.local[.properties]

  datasource:
    url: jdbc:mysql://10.0.14.20:3306/v3test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 'root'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000

  data:
    redis:
      host: 10.0.14.20
      port: 6379
      database: 0
      timeout: 3000ms

  rabbitmq:
    host: 10.0.14.20
    port: 5672
    username: guest
    password: guest
    virtual-host: /taokev2-test

  jpa:
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

taoke:
  # 本地开发：mock 短信 + 关闭滑块，与前端 NEXT_PUBLIC_MOCK_SMS=true 对齐
  sms:
    provider: mock
  captcha:
    enabled: false
  elasticsearch:
    uris: http://10.0.14.20:9200
    username: app_search
    password: taokev2search
    index-name: taokev2app
    sync-interval: 10000
  event:
    enabled: true
  jwt:
    secret: taoke-v2-jwt-secret-key-must-be-at-least-256-bits-long!!
  storage:
    provider: local
    # 相对路径在 dev 下由 StorageDirectoryResolver 自动定位 monorepo 内 frontend/public
    base-dir: ../../frontend/public
    public-domain:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:3001
      - http://127.0.0.1:3001
    allow-credentials: true
  # AI 能力（开发环境默认禁用，将 enabled 改为 true 并填入真实 base-url + api-key 后启用）
  ai:
    enabled: true
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: 'sk-4b2e518d30534adcb6c5f7ea6239c591'
    model: qwen3.6-plus
    temperature: 0.2
    timeout-ms: 1200000
    max-input-chars: 50000

# 爬虫服务（开发环境）
# crawler-service 在 Docker 内运行时，回调须用 host.docker.internal 访问宿主机 Java（18080）
# 若改为本机直接 uvicorn 启动爬虫，可改回 http://localhost:18080/internal/crawl/callback
crawler:
  base-url: http://localhost:8100
  callback-url: http://host.docker.internal:8080/internal/crawl/callback
  callback-token: local-crawler-token

logging:
  level:
    com.taoke: info
    org.springframework.security: info
