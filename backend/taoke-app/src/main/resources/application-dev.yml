# ============================================================
# 开发环境配置 — 中间件连接、密钥、日志级别等
# ============================================================
# Nacos 配置中心
spring:
  datasource:
    url: jdbc:mysql://10.0.14.20:3306/v3test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 'root'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000

  data:
    redis:
      host: localhost
      port: 6379
      password: '123456'
      database: 0
      timeout: 3000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /taokev2-dev

  jpa:
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

taoke:
  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: taokev2search
    index-name: taokev2app
    sync-interval: 10000
    auto-reindex-on-startup: true
  event:
    enabled: true
  jwt:
    secret: taoke-v2-jwt-secret-key-must-be-at-least-256-bits-long!!
  sms:
    provider: mock
  storage:
    provider: local
    base-dir: ../../frontend/public
    public-domain:
  cors:
    allowed-origins: '*'
    allow-credentials: false
  # AI 能力（开发环境默认禁用，将 enabled 改为 true 并填入真实 base-url + api-key 后启用）
  ai:
    enabled: true
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: 'sk-4b2e518d30534adcb6c5f7ea6239c591'
    model: qwen3.6-plus
    temperature: 0.2
    timeout-ms: 1200000
    max-input-chars: 50000

logging:
  level:
    com.taoke: debug
    org.springframework.security: debug
