# ============================================================
# 开发环境配置 — 中间件连接、密钥、日志级别等
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taokev2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000

  data:
    redis:
      host: localhost
      port: 6379
      password: root
      database: 0
      timeout: 3000ms

  jpa:
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

taoke:
  jwt:
    secret: taoke-v2-jwt-secret-key-must-be-at-least-256-bits-long!!
  sms:
    provider: mock
  storage:
    provider: local
    base-dir: ./storage
    public-domain:

logging:
  level:
    com.taoke: debug
    org.springframework.security: debug
