# ============================================================
# 开发环境配置 — 中间件连接、密钥、日志级别等
# ============================================================
# Nacos 配置中心
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taokev2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /taokev2-dev

  jpa:
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

taoke:
  event:
    enabled: true
  jwt:
    secret: taoke-v2-jwt-secret-key-must-be-at-least-256-bits-long!!
  sms:
    provider: mock
  storage:
    provider: local
    base-dir: ../../frontend/public
    public-domain:
  cors:
    allowed-origins: '*'
    allow-credentials: false

logging:
  level:
    com.taoke: debug
    org.springframework.security: debug
