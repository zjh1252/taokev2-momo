# ============================================================
# 生产环境配置 — 通过环境变量或配置中心注入实际值
# ============================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/v3test?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:taoke}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

  # Nacos 配置中心
  nacos:
    config:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:prod}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}

taoke:
  jwt:
    secret: ${JWT_SECRET:}
  # 其余 UCenter / 短信凭据继承自通用 application.yml（appid=2、UC_KEY、pxb 凭据）；
  # 生产仅覆盖 UCenter 地址为生产 uc_server
  ucenter:
    api-url: ${UCENTER_API_URL:http://shequ.taoke.com/uc_server}

logging:
  level:
    com.taoke: info
    org.springframework.security: warn
