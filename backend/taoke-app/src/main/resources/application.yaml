server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: taokewang
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
  servlet:
    multipart:
      enabled: true
      max-file-size: 10485760 # 10MB
      max-request-size: 10485760 # 10MB

