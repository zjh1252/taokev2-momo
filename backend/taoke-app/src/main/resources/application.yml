server:
  port: 8080

spring:
  application:
    name: taoke-app

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# JWT 令牌过期时间（密钥放在环境配置中）
taoke:
  jwt:
    access-token-expire-ms: 7200000
    refresh-token-expire-ms: 604800000
  sms:
    code-length: 6
    expire-minutes: 5
  event:
    enabled: false
    exchange: taoke.events
  upload:
    base-dir: uploads
    max-file-size: 10485760
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
    allowed-image-extensions: [jpg, jpeg, png, gif, webp]
    allowed-file-extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, txt, zip, rar]

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
