server:
  port: 8080

spring:
  application:
    name: taoke-app

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# JWT 令牌过期时间（密钥放在环境配置中）
taoke:
  jwt:
    access-token-expire-ms: 7200000
    refresh-token-expire-ms: 604800000
  sms:
    code-length: 6
    expire-minutes: 5
  event:
    enabled: true
    exchange: taoke.events
  upload:
    base-dir: uploads
    max-file-size: 10485760
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
    allowed-image-extensions: [jpg, jpeg, png, gif, webp]
    allowed-file-extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, txt, zip, rar]
  # AI 基础能力（OpenAI 兼容协议）— 默认禁用，按 profile 在 application-{profile}.yml 中开启
  ai:
    enabled: false
    base-url: ''
    api-key: ''
    model: gpt-4o-mini
    temperature: 0.2
    timeout-ms: 60000
    max-input-chars: 50000

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 爬虫服务配置
crawler:
  base-url: http://localhost:8100
  callback-url: http://localhost:8080/internal/crawl/callback
  callback-token: ${CRAWLER_CALLBACK_TOKEN:default-token}

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:nacos:shared-config.yml?group=DEFAULT_GROUP
      - optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?group=DEFAULT_GROUP
  nacos:
    config:
      server-addr: 10.0.14.20:8848
      namespace: dev
      username: nacos
      password: nacos
