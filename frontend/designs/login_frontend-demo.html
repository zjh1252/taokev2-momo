<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#38485d",
              "tertiary-container": "#67778e",
              "on-error-container": "#93000a",
              "surface-dim": "#d8dadd",
              "primary": "#be0003",
              "surface-variant": "#e0e3e6",
              "on-secondary-fixed": "#0d1c2f",
              "on-primary-fixed": "#410000",
              "tertiary-fixed": "#d3e4fe",
              "inverse-on-surface": "#eff1f4",
              "on-background": "#191c1e",
              "on-surface": "#191c1e",
              "surface-bright": "#f7f9fc",
              "on-secondary": "#ffffff",
              "on-secondary-fixed-variant": "#3a485c",
              "secondary-fixed-dim": "#b9c7e0",
              "surface": "#f7f9fc",
              "primary-fixed-dim": "#ffb4a8",
              "inverse-surface": "#2d3133",
              "on-tertiary-fixed": "#0b1c30",
              "on-primary-container": "#fffeff",
              "on-secondary-container": "#57657b",
              "surface-container-lowest": "#ffffff",
              "secondary-container": "#d5e3fd",
              "surface-container-high": "#e6e8eb",
              "on-primary-fixed-variant": "#930002",
              "surface-container-highest": "#e0e3e6",
              "primary-container": "#e62117",
              "secondary-fixed": "#d5e3fd",
              "surface-container-low": "#f2f4f7",
              "surface-container": "#eceef1",
              "primary-fixed": "#ffdad5",
              "secondary": "#515f74",
              "tertiary": "#4e5e74",
              "on-error": "#ffffff",
              "on-tertiary": "#ffffff",
              "background": "#f7f9fc",
              "on-primary": "#ffffff",
              "outline": "#926e69",
              "tertiary-fixed-dim": "#b7c8e1",
              "on-tertiary-container": "#fffeff",
              "outline-variant": "#e7bdb6",
              "inverse-primary": "#ffb4a8",
              "surface-tint": "#c00003",
              "on-surface-variant": "#5e3f3b",
              "error": "#ba1a1a",
              "error-container": "#ffdad6"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .signature-gradient {
        background: linear-gradient(135deg, #be0003 0%, #e62117 100%);
      }
      .glass-effect {
        backdrop-filter: blur(20px);
        background: rgba(255, 255, 255, 0.8);
      }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Auth Container -->
<main class="w-full max-w-[960px] min-h-[500px] flex rounded-lg overflow-hidden shadow-2xl bg-surface-container-lowest relative">
<!-- Left Side: Brand Identity (Hidden on Mobile) -->
<section class="hidden md:flex md:w-[45%] signature-gradient relative flex-col justify-between p-10 overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-48 h-48 bg-black/10 rounded-full blur-2xl"></div>
<!-- Brand Logo -->
<div class="z-10">
<div class="flex items-center gap-2">
<div class="bg-white p-1.5 rounded-lg">
<span class="material-symbols-outlined text-primary text-2xl font-bold" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<span class="text-white font-headline font-black text-2xl tracking-tighter">淘课网</span>
</div>
</div>
<!-- Content Area -->
<div class="z-10 mt-auto">
<h1 class="text-white font-headline font-extrabold text-3xl leading-tight tracking-tight mb-4">
                    淘课网 - <br/>您的企业培训专家
                </h1>
<p class="text-white/80 font-body text-lg font-medium">
                    汇聚顶尖导师，赋能组织成长
                </p>
</div>
<!-- Subtle Visual Accent -->
<div class="z-10 mt-12 flex gap-4">
<div class="h-1 w-12 bg-white/40 rounded-full"></div>
<div class="h-1 w-4 bg-white/20 rounded-full"></div>
<div class="h-1 w-4 bg-white/20 rounded-full"></div>
</div>
<!-- Background Image Mask Overlay -->
<div class="absolute inset-0 z-0 opacity-20 mix-blend-overlay">
<img class="w-full h-full object-cover" data-alt="modern corporate office interior with professional atmosphere and high-end executive furniture under soft natural lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzG54jBP6-YBdO-iw9AoAddlUd6ehEDO8vNMxHGrnUNMYKBuMOFabXkYvqiCsZajpXkzEa70i8UW_PfLGHUwPtHUftTlevSFscqQtMrLcA4D3X1-vpa1Ap5dlFnFQqyK4Hp3GUlm041lC8mo0eBXrS54mgnXleMW1MLk3fRVehPRne_ioFGjoKBPZ-1l7QBg4YXy-1CiVNzuh4_W2EyetpL5E-u6cS1E_zaZQoINshY6Utw978dAqPxqtnJDj_XGd89g-KPbbhTtc"/>
</div>
</section>
<!-- Right Side: Interaction Form -->
<section class="w-full md:w-[55%] bg-surface-container-lowest p-8 md:p-12 flex flex-col justify-center">
<!-- Mobile Brand Logo (Visible only on small screens) -->
<div class="md:hidden flex items-center gap-2 mb-8">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="text-on-surface font-headline font-black text-2xl tracking-tighter">淘课网</span>
</div>
<div class="mb-10">
<h2 class="text-on-surface font-headline font-bold text-2xl mb-2">欢迎来到淘课网</h2>
<p class="text-secondary font-body text-sm">未注册的手机号验证后将自动创建账号</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Phone Input Group -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-secondary tracking-widest uppercase">手机号码</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 flex items-center pl-4 pr-3 border-r border-surface-variant/30">
<span class="text-on-surface font-medium text-sm">+86</span>
</div>
<input class="w-full h-12 pl-16 pr-4 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-on-surface font-body text-base placeholder:text-secondary/50 transition-all outline-none" maxlength="11" placeholder="请输入 11 位手机号码" type="tel"/>
</div>
</div>
<!-- Verification Code Group -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-secondary tracking-widest uppercase">验证码</label>
<div class="flex gap-3">
<div class="relative flex-1 group">
<input class="w-full h-12 px-4 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-on-surface font-body text-base placeholder:text-secondary/50 transition-all outline-none" maxlength="6" placeholder="输入 6 位验证码" type="text"/>
</div>
<button class="h-12 px-6 whitespace-nowrap text-primary font-bold text-sm hover:bg-primary/5 rounded-xl transition-colors" type="button">
                            获取验证码
                        </button>
</div>
</div>
<!-- Agreement -->
<div class="flex items-start gap-3 py-2">
<div class="mt-1 relative flex items-center">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 focus:ring-offset-0 transition-all" id="agreement" type="checkbox"/>
</div>
<label class="text-xs text-secondary leading-relaxed" for="agreement">
                        我已阅读并同意
                        <a class="text-primary font-semibold hover:underline" href="#">《用户服务协议》</a>
                        和
                        <a class="text-primary font-semibold hover:underline" href="#">《隐私政策》</a>
</label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 signature-gradient text-white font-headline font-bold text-base rounded-xl shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>登录 / 注册</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Social/Alternative Login (Editorial Style) -->
<div class="mt-12">
<div class="relative flex items-center justify-center mb-8">
<div class="flex-grow border-t border-surface-variant/50"></div>
<span class="flex-shrink mx-4 text-[10px] font-bold text-secondary uppercase tracking-[0.2em]">或通过社交账号登录</span>
<div class="flex-grow border-t border-surface-variant/50"></div>
</div>
<div class="flex justify-center gap-6">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low text-secondary hover:text-primary transition-colors hover:bg-surface-container-high">
<span class="material-symbols-outlined text-2xl">chat</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low text-secondary hover:text-primary transition-colors hover:bg-surface-container-high">
<span class="material-symbols-outlined text-2xl">fingerprint</span>
</button>
</div>
</div>
</section>
</main>
<!-- Footer Meta (Shared Component Identity) -->
<footer class="fixed bottom-0 w-full py-8 pointer-events-none">
<div class="max-w-7xl mx-auto px-8 flex justify-between items-center">
<p class="text-[10px] text-secondary/40 font-medium tracking-widest uppercase">
                © 2024 淘课网 Taoke.com Executive Training
            </p>
<div class="flex gap-6 pointer-events-auto">
<a class="text-[10px] text-secondary/40 font-medium tracking-widest uppercase hover:text-primary transition-colors" href="#">帮助中心</a>
<a class="text-[10px] text-secondary/40 font-medium tracking-widest uppercase hover:text-primary transition-colors" href="#">隐私政策</a>
</div>
</div>
</footer>
</body></html>
