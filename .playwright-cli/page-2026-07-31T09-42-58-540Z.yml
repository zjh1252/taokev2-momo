                  - heading "杭州丹研企业管理咨询有限公司-中企研发管理网简介" [level=3] [ref=e113]
                  - generic [ref=e114]: 杭州丹研企业管理咨询有限公司开发投资的中企研发管理网[]，专注于研发管理培训领域，以推动中国企业研发管理水平的持续提升为目标，并努力成为您长期信赖、共同成长的伙伴！ 优势：国内首家融合研发、创新、管理为一体的咨询机构，专注于研发管理和咨询的提升领域 使命：努力打造国内研发管理培训领域第一品牌 价值：诚信、务实、创新、合作 师资：拥有一支高素质的专业顾问团队。具备国内知名企业平均达10年以上的研发工作和企业中高层管理经验。对IBM管理体系、华为管理体系、微软产品管理体系和产品战略体系深入研究积累了丰富实战经验。成为百家企业内训项目的长年咨询顾问 项目：内训、辅导、考察、咨询 ■项目简单介绍： 企业内训：是针对企业实际需求的一种实操性培训方案，通过全面的沟通和调查反馈，使我们真正有实力做到为企业度身定制结合企业实际需求的研发管理内训课程方案。课程与企业实际紧密结合，极具可操作性和实用价值 内训特色：课前调研沟通+课程切合实际+构建背景体系+行业案例参考+内部实施研讨+操作技巧辅导 内训流程： 第一步：初步调查--详细查看附件课程目录，确定需培训课题，根据企业客户的行业特点和培训需求反馈，由培训讲师量身定制初步培训方案，向客户征求意见和建议。 第二步：了解需求--同客户做多层面的深入交流和互动，了解同项目有关的情况，如企业在实施项目中遇到的问题和难点及对培训的期望和培训形式的要求等，共同确定培训目标。 第三步：策划大纲--根据客户实际情况和意见反馈，确定最后的培训方案。 第四步：签订协议--签订培训协议，制定具体的培训实施方案。 第五步：培训准备--讲师准备内部教材，并召开培训筹备会。 第六步：培训实施--实施培训由主讲教师和助教组成一个教学小组。培训形式以理论讲解同案例分析相结合，同时辅助以个人练习、项目模拟、小组讨论、分组竞赛和自由发问等多种培训手段保证培训目标的最终实现。 第七步：课程评估--在学习结束后，由学员结合自己的工作情况，制定行动计划或撰写学习论文,并由教师批阅点评。（结课论文两周内提交）。 第八步：效果回访--效果定期回访追踪。培训顾问对内训情况进行深入总结，培训参加者可通过电话、邮件等方式与顾问直接沟 通，共同探讨解决参加者在工作中遇到的实际问题。 >>>您的需求是我们的动力！ >>>您的满意是我们的宗旨！ >>>共同发展是我们的心愿！
